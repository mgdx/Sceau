# Recette fdroiddata de Sceau (metadata/io.github.mgdx.sceau.yml), copie de celle soumise par
# merge request le 2026-10-12. Mode d'emploi : docs/fdroid/README.md. Décisions : D25 (builds
# reproductibles), D38, D53, D54.
#
# Un seul APK, l'universel : pas de VercodeOperation, versionCode identique à celui de
# app/build.gradle.kts. Les APK par architecture restent réservés aux releases GitHub ; les splits
# ABI produisant cinq APK, `output` désigne l'universel.
#
# Environnement de build (D49) : JDK 25 pour le démon Gradle et JDK 17 pour les toolchains,
# installés par apt (le serveur de build est sous Debian trixie, d'où bookworm pour le 17) ;
# plugin foojay retiré et téléchargement de JDK interdit, pour qu'aucun JDK binaire ne soit
# récupéré pendant le build ; CMake 4.1.2 et NDK r28c par le SDK. Le sous-module OpenJPEG est
# compilé depuis les sources. Ni scanignore ni scandelete : le scanner n'y trouve rien (D54).
#
# Ce fichier est un point fixe de `fdroid rewritemeta` (ruamel.yaml 0.18.6) : ne pas le
# reformater à la main, commentaires mis à part.

Categories:
  - Security
License: GPL-3.0-only
AuthorName: mgdx
WebSite: https://github.com/mgdx/Sceau
SourceCode: https://github.com/mgdx/Sceau
IssueTracker: https://github.com/mgdx/Sceau/issues
Changelog: https://github.com/mgdx/Sceau/releases
Liberapay: mgdx

AutoName: Sceau

RepoType: git
Repo: https://github.com/mgdx/Sceau.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: 74fa81630a7a550e30c7ec0e4df2b6d988c809ec
    subdir: app
    submodules: true
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - apt-get install -y openjdk-25-jdk-headless
      - update-java-alternatives -a
    gradle:
      - yes
    output: build/outputs/apk/release/app-universal-release-unsigned.apk
    binary: https://github.com/mgdx/Sceau/releases/download/v%v/sceau-%v-universal.apk
    prebuild:
      - sed -i -e '/foojay/d' ../settings.gradle.kts
      - echo -e '\norg.gradle.java.installations.auto-download=false' >> ../gradle.properties
      - sdkmanager 'cmake;4.1.2'
    ndk: r28c

AllowedAPKSigningKeys: dee8105b0b0f27b444b3303e0b34022835188d49d952ff2542fbbc057927434b

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.0
CurrentVersionCode: 1
