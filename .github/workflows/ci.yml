name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Gradle wrapper validation
        uses: gradle/actions/wrapper-validation@v6

      # JDK 17: compilation toolchain for the modules.
      # JDK 25: JVM of the Gradle daemon (gradle/gradle-daemon-jvm.properties). The last one in
      # the list becomes JAVA_HOME.
      - name: JDK 17 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Checks (tests, lint, ktlint) and debug APK
        run: ./gradlew check :app:assembleDebug
